[project]
name = "mon-ia-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zebi lobognon", email = "zebilobognon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.143.0",
    "jinja2>=3.1.6",
    "load-dotenv>=0.1.0",
    "numpy>=2.5.4",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "requests==2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
formation-ia = "formation_ia:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
